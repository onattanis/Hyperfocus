<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="An interactive book writing/reading tool" />
    <title>Hyperfocus</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Caveat:wght@400;600&display=swap" />
    <!--logo-css-->
    <style>
      html, body { margin: 0; background: #f4ecdc; }
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; }
      /* Start-up screen: sits over the page and fades out when the app is ready (src/ui/loading.ts). */
      #boot { position: fixed; inset: 0; z-index: 1000; background: #f4ecdc; transition: opacity .4s ease; }
      #boot.boot-done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="boot"><!--loader--></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
